<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline · Hearay</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f6f8;
        color: #101418;
        font:
          16px/1.5 system-ui,
          sans-serif;
        padding: 24px;
        text-align: center;
      }
      .b {
        color: #1f4fd8;
        font-weight: 800;
        font-size: 22px;
      }
      button {
        margin-top: 16px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 14px;
        background: #1f4fd8;
        color: #fff;
        font-weight: 700;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="b">Hearay</div>
      <h1 style="font-size: 20px">You're offline</h1>
      <p>
        Connect to the internet to renew your DStv. If you already paid, your payment is safe — open
        this page again when you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
